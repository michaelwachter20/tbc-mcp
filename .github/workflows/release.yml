# Builds the download package and publishes a GitHub Release whenever a version tag (v0.3.0, v0.4.0 ...) is pushed.
# The zip contains exactly the paths listed in release_files.txt (no tests, dev tools or per-machine logs).
#
# Maintainer steps (GitHub Desktop): bump SERVER_VERSION in mcp_server/tbc_mcp_server.py and commit; History tab ->
# right-click the commit -> Create Tag "v<version>"; Push origin. Check the run under the repository's Actions tab.
# Preview the same zip locally with: powershell -ExecutionPolicy Bypass -File tools\make_release.ps1  (-> dist\)
#
# How it works: one job on GitHub's Ubuntu runner. It checks out the tagged commit, copies each path in
# release_files.txt into dist/tbc-mcp-<tag>/, removes __pycache__, *.pyc, crash_log.md, tbc_errors.log, *.tmp
# and knowledge/license (the same clean-up as make_release.ps1), zips that folder to dist/tbc-mcp-<tag>.zip,
# and creates the GitHub Release <tag> with that zip attached, fixed install notes and GitHub's generated
# change list. If a release for the tag already exists, only the zip is replaced (--clobber); its notes are
# left as they are. The zip name comes from the tag, so the first step refuses a tag that isn't exactly
# "v" + SERVER_VERSION: a mistyped "v.0.4.0" once published a release and zip under that name.
# No TBC and no Python are involved; nothing is tested here.
name: Release package

# runs only when a tag starting with "v" is pushed (not on ordinary commits)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release and upload the zip

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged code
        uses: actions/checkout@v4

      # SERVER_VERSION = "0.5.0" in the server must be tagged v0.5.0; anything else stops here, before a release
      - name: Tag matches SERVER_VERSION
        run: |
          version=$(sed -n 's/^SERVER_VERSION = "\(.*\)"$/\1/p' mcp_server/tbc_mcp_server.py)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match SERVER_VERSION ${version} (expected v${version})."
            exit 1
          fi

      # GITHUB_REF_NAME is the pushed tag (e.g. v0.3.0), so the folder and zip are named tbc-mcp-v0.3.0
      - name: Build the zip from release_files.txt
        run: |
          name="tbc-mcp-${GITHUB_REF_NAME}"
          mkdir -p "dist/${name}"
          # release_files.txt minus comment and blank lines; each path (file or whole folder) is copied in
          grep -v '^\s*#' release_files.txt | sed '/^\s*$/d' | while read -r item; do
            cp -r "$item" "dist/${name}/"
          done
          # strip generated and per-machine files (same list as tools/make_release.ps1)
          find "dist/${name}" -name '__pycache__' -prune -exec rm -rf {} +
          find "dist/${name}" \( -name '*.pyc' -o -name 'crash_log.md' -o -name 'tbc_errors.log' -o -name '*.tmp' \) -delete
          rm -rf "dist/${name}/knowledge/license"
          # zip from inside dist/ so the archive holds one top-level folder tbc-mcp-<tag>/
          (cd dist && zip -qr "${name}.zip" "${name}")
          echo "Built dist/${name}.zip with $(find "dist/${name}" -type f | wc -l) files"

      # The gh CLI (preinstalled on the runner) authenticates with the job's own token (GH_TOKEN). The release
      # notes are written to notes.md first; the backslash-escaped backticks keep the shell from running them
      # as commands inside the unquoted heredoc, while ${GITHUB_REF_NAME} is still filled in.
      # Release exists already (e.g. the workflow was re-run): replace the zip only. Otherwise create it.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          **Built for Trimble Business Center 2026.10** (build 44.0.9666.28609). See the README's *TBC versions* section
          before using it on another release.

          **Install:** download \`tbc-mcp-${GITHUB_REF_NAME}.zip\` below, unzip it somewhere permanent and follow
          *How to install* in the README (re-run \`install_macro.ps1\` if the bridge macro changed in this release).
          EOF
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "dist/tbc-mcp-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "dist/tbc-mcp-${GITHUB_REF_NAME}.zip" \
              --title "TBC MCP ${GITHUB_REF_NAME} (for TBC 2026.10)" --notes-file notes.md --generate-notes
          fi
